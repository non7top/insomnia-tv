name: insomniaTV CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"

# A new push to a PR supersedes its running checks; master runs always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install lint tools
        run: pip install clang-format cpplint

      - name: Run cpplint
        run: cpplint --recursive src/ test/

      - name: Run clang-format check
        run: clang-format --style=file --dry-run --Werror src/**/*.cpp test/**/*.cpp

      - name: Check web UI script syntax
        run: node --check src/web/ui/app.js

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-pio

      - name: Run native tests
        run: pio test -e native

      # No .pio cache and no PLATFORMIO_BUILD_CACHE_DIR in this job: a build
      # restored from either has no .gcno files, so lcov finds no records (#52).
      - name: Generate coverage report
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov
          lcov --capture --directory . --build-directory . --ignore-errors gcov --output-file .pio/build/native/coverage.info
          lcov --remove .pio/build/native/coverage.info '*/test/*' '*/.pio/*' --ignore-errors unused --output-file .pio/build/native/coverage.info

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: .pio/build/native/coverage.info

  # Runs alongside lint and unit-tests rather than after them. Pull requests
  # build only the deployed board; master also builds the other targets.
  build-firmware:
    runs-on: ubuntu-latest
    env:
      PLATFORMIO_BUILD_CACHE_DIR: /home/runner/.platformio/cache/
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-pio
        with:
          cache-pio-dir: "true"

      - name: Build ESP32-C3 firmware
        run: pio run -e esp32c3

      - name: Build other targets
        if: github.event_name == 'push'
        run: pio run -e esp32dev -e qemu-esp32

      - name: Upload ESP32-C3 firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-esp32c3
          path: .pio/build/esp32c3/firmware.bin

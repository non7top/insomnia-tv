name: Secrets scan

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: secrets-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ripsecrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Scan for secrets and MAC addresses
        run: scripts/check_secrets.sh
